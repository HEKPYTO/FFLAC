[project]
name = "floatflac"
version = "0.0.0"
description = "Safe CLI wrapper for float-sample FLAC"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
floatflac = "floatflac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floatflac"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
markers = ["performance: performance benchmarks"]
